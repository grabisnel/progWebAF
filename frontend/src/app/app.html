<div class="pagina">
  <header class="cabecalho">
    <h1 class="marca">Gestor Financeiro</h1>
  </header>

  <main>
    <app-resumo />

    @if (mov.erro()) {
      <div class="aviso-erro">
        <span>{{ mov.erro() }}</span>
        <button type="button" class="botao-icone" (click)="mov.erro.set('')">
          ✕
        </button>
      </div>
    }

    <div class="colunas">
      <aside class="coluna-form">
        <app-formulario />
      </aside>

      <section class="cartao extrato">
        <h2 class="titulo-extrato">Extrato</h2>
        <app-filtros />
        <app-lista />
      </section>
    </div>
  </main>
</div>

<app-toast />
